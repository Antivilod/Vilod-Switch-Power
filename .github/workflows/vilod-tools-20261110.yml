    - name: Validate source and local tools
      run: |-
        python scripts/check-source-snapshot.py
        python scripts/audit-release-history.py
        python scripts/test-audit.py
        cargo build --locked --manifest-path tools/checksum/Cargo.toml
    - name: Publish the reviewed source branch
      id: publish
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c commit.gpgsign=false commit -m 'VSP 0.8.3: installer diagnostics and checksum CLI'
        gh auth setup-git
        git push origin HEAD:refs/heads/tools/vsp-install-diagnostics
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  windows:
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        ref: ${{ needs.prepare.outputs.sha }}
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
      with:
        dotnet-version: 10.0.x
    - name: Build installer and run core tests
      run: ./scripts/build-installer.ps1
    - name: Verify CPU power policy
      run: |-
        dotnet run --project tests/QuietPC.Windows.Tests -c Release -- artifacts/release/CPU-POLICY-VERIFICATION.json
        if ($LASTEXITCODE) { throw "CPU policy regression failed" }
    - name: Verify setup conflicts, install, restore, UI and uninstall
      run: ./scripts/test-installer.ps1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
